<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/menu.css">
    <title>CRUD - Criar Lista</title>
</head>
<body>

    <div id="menu">
        <div>Sistema CRUD</div>
        <div></div>
        <p class="menuLinks" onclick="location.href='index.html'">Criar</p>
        <p class="menuLinks" onclick="location.href='pages/listas.html'">Listas</p>
        <p class="menuLinks" onclick="location.href='pages/dados.html'">Dados</p>
    </div>

    <!-- Modal criar lista -->
    <div id="black_bg"></div>
    <div class="modal" id="createBox">
        <h2>Nome da nova Lista:</h2>
        <input type="text" id="input-nome" placeholder="Digite aqui!">
        <div class="modal-buttons">
            <div class="cd_button btn-green" id="cb_submit" onclick="criarLista()">Criar</div>
            <div class="cd_button btn-red" onclick="fecharModal()">Cancelar</div>
        </div>
    </div>

    <main>
        <div id="newList" onclick="abrirModal()">+ Criar nova Lista</div>
        <p class="hint">Clique para criar uma nova lista de tarefas</p>
    </main>

    <script src="javascript/index.js"></script>
</body>
</html>
